<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSA 卡牌收藏庫</title>
<style>
  :root{
    --bg:#0f1115; --card:#1a1d24; --accent:#e8523f; --text:#f2f2f2;
    --muted:#9aa0aa; --line:#2a2e37; --ok:#3ecf8e; --bad:#f26d6d;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;
    background:var(--bg); color:var(--text); padding:16px; max-width:560px; margin:0 auto;
  }
  h1{font-size:20px; margin:8px 0 16px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px;}
  label{display:block; font-size:13px; color:var(--muted); margin:12px 0 4px;}
  input[type=text], input[type=number], input[type=date], input[type=search], select{
    width:100%; padding:10px; border-radius:8px; border:1px solid var(--line);
    background:#12141a; color:var(--text); font-size:15px;
  }
  .row{display:flex; gap:8px;}
  .row > *{flex:1;}
  button{
    width:100%; padding:14px; border:none; border-radius:10px; background:var(--accent);
    color:#fff; font-size:16px; font-weight:600; margin-top:16px; cursor:pointer;
  }
  button:disabled{opacity:.5;}
  button.secondary{background:#2a2e37;}
  button.small{width:auto; padding:8px 12px; font-size:13px; margin-top:0;}
  button.danger{background:#5a2323;}
  #preview{width:100%; border-radius:10px; margin-top:12px; display:none;}
  .hint{font-size:12px; color:var(--muted); margin-top:4px;}
  .status{font-size:14px; margin-top:10px; padding:10px; border-radius:8px; display:none;}
  .status.loading{display:block; background:#22262f; color:var(--muted);}
  .status.error{display:block; background:#3a1f1f; color:var(--bad);}
  .status.success{display:block; background:#1c332a; color:var(--ok);}
  .status.warn{display:block; background:#3a2f14; color:#f2b84b;}
  .link{color:#7db8ff; text-decoration:none;}
  a.link{word-break:break-all;}
  #confirmSection, #resultSection, #inventorySection{display:none;}
  .summary-row{display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--line); font-size:14px;}
  .summary-row b{color:var(--ok);}
  .summary-row b.neg{color:var(--bad);}

  /* tabs */
  .tabs{display:flex; gap:8px; margin-bottom:16px;}
  .tabs button{margin-top:0; flex:1; background:#20232b; color:var(--muted);}
  .tabs button.active{background:var(--accent); color:#fff;}

  /* inventory list */
  .toolbar{display:flex; gap:8px; margin-bottom:12px;}
  .toolbar button{margin-top:0; width:auto; padding:10px 14px;}
  .item{display:flex; gap:12px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px;}
  .thumb{width:64px; height:64px; border-radius:8px; object-fit:cover; background:#12141a; flex-shrink:0;}
  .item-body{flex:1; min-width:0;}
  .item-title{font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .item-meta{font-size:12px; color:var(--muted); margin-top:2px;}
  .badge{display:inline-block; font-size:11px; padding:2px 8px; border-radius:20px; margin-left:6px;}
  .badge.instock{background:#1c332a; color:var(--ok);}
  .badge.sold{background:#2a2e37; color:var(--muted);}
  .item-amounts{display:flex; justify-content:space-between; font-size:13px; margin-top:6px;}
  .item-links{font-size:12px; margin-top:6px; line-height:1.8;}
  .item-links a{margin-right:10px; white-space:nowrap;}
  .item-actions{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap;}
  .item-actions button{white-space:nowrap;}
  .sold-form{margin-top:10px; padding-top:10px; border-top:1px solid var(--line); display:none;}
  .sold-form.open{display:block;}
  .empty{text-align:center; color:var(--muted); padding:30px 0; font-size:14px;}

  /* summary */
  .big-pct{font-size:34px; font-weight:700; margin-top:4px;}
  .big-pct.pos{color:var(--ok);}
  .big-pct.neg{color:var(--bad);}
  .summary-grid{display:flex; gap:16px; margin-top:14px; padding-top:14px; border-top:1px solid var(--line);}
  .summary-grid > div{flex:1;}
  .summary-grid .val{font-size:16px; font-weight:600; margin-top:2px;}
  #sumRealized{margin-top:10px;}
</style>
</head>
<body>

<h1>📇 PSA 卡牌收藏庫</h1>

<!-- 設定：請部署 Apps Script 後，把 Web App 網址填在這裡 -->
<script>
  const CONFIG = {
    GAS_URL: 'https://script.google.com/macros/s/AKfycbwL3bUioITPSry8vdjMQ-GfSvbK6mvFoSw9gz_jT1Bhq_viMjpi-5AQgEQXMHztUUjNeQ/exec'
  };
</script>

<div class="tabs">
  <button id="tabAdd" class="active">📷 新增卡牌</button>
  <button id="tabInventory">📋 我的庫存</button>
</div>

<!-- ============ 新增卡牌 ============ -->
<div id="addFlow">
  <div class="card" id="captureSection">
    <label>1. 拍照 / 選擇 PSA 鑑定卡照片</label>
    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;">
    <input type="file" id="galleryInput" accept="image/*" style="display:none;">
    <div class="row">
      <button type="button" class="secondary" id="cameraBtn" style="margin-top:0;">📷 拍照</button>
      <button type="button" class="secondary" id="galleryBtn" style="margin-top:0;">🖼 從相簿選擇</button>
    </div>
    <img id="preview" alt="預覽">
    <button id="recognizeBtn" disabled>辨識卡牌</button>
    <div class="status" id="recognizeStatus"></div>
    <div class="hint" style="margin-top:12px;">拼圖卡或一次買好幾張算一個總價？<a class="link" href="javascript:void(0)" id="goBatchBtn">改用批次新增 →</a></div>
  </div>

  <!-- ============ 批次新增（拼圖卡 / 打包合購） ============ -->
  <div class="card" id="batchCaptureSection" style="display:none;">
    <label>🧩 批次新增：選擇這組的所有照片</label>
    <div class="hint">適合拼圖卡（多張拼成一張圖）或一次買好幾張只算一個總價的情況</div>
    <input type="file" id="batchGalleryInput" accept="image/*" multiple style="display:none;">
    <input type="file" id="batchCameraInput" accept="image/*" capture="environment" style="display:none;">
    <div class="row" style="margin-top:10px;">
      <button type="button" class="secondary" id="batchGalleryBtn" style="margin-top:0;">🖼 從相簿多選</button>
      <button type="button" class="secondary" id="batchCameraBtn" style="margin-top:0;">📷 拍照加入</button>
    </div>
    <div id="batchThumbs" style="display:flex; gap:8px; flex-wrap:wrap; margin-top:12px;"></div>
    <button id="batchRecognizeBtn" disabled>辨識全部（<span id="batchCount">0</span> 張）</button>
    <button class="secondary" id="batchCancelBtn">取消，回到單張新增</button>
    <div class="status" id="batchCaptureStatus"></div>
  </div>

  <div class="card" id="batchReviewSection" style="display:none;">
    <label>確認每張卡的資料</label>
    <div id="batchDraftList"></div>

    <label style="margin-top:16px;">這組怎麼算價格？</label>
    <select id="groupType">
      <option value="拼圖">🧩 拼圖卡（多張拼一張圖，只能整組一起賣）</option>
      <option value="打包">📦 打包一起買（一次買好幾張算一個總價，之後可以拆開分別賣）</option>
    </select>

    <label>總買入金額（這組全部卡片合計）</label>
    <div class="row">
      <input type="number" id="batchBuyAmount" placeholder="金額" step="0.01">
      <select id="batchBuyCurrency">
        <option value="JPY">JPY 日圓</option>
        <option value="USD">USD 美金</option>
        <option value="TWD">TWD 台幣</option>
      </select>
    </div>

    <label>總現在市值（選填）</label>
    <div class="row">
      <input type="number" id="batchCurrentAmount" placeholder="金額" step="0.01">
      <select id="batchCurrentCurrency">
        <option value="JPY">JPY 日圓</option>
        <option value="USD">USD 美金</option>
        <option value="TWD">TWD 台幣</option>
      </select>
    </div>
    <div class="hint">這個總額會顯示在組內每一張卡上，總覽的總成本/總市值只會計算一次，不會重複相加</div>

    <button id="batchSubmitBtn">送出整組（<span id="batchSubmitCount">0</span> 張）</button>
    <button class="secondary" id="batchBackBtn">上一步</button>
    <div class="status" id="batchSubmitStatus"></div>
  </div>

  <div class="card" id="batchResultSection" style="display:none;">
    <label>✅ 已成功入庫一整組</label>
    <div class="hint" id="batchResultText"></div>
    <button id="batchNewBtn">再新增一組</button>
    <button class="secondary" id="batchGoInventoryBtn">查看庫存</button>
  </div>

  <div class="card" id="confirmSection">
    <label>2. 確認 / 修正辨識結果</label>
    <div class="row" style="flex-wrap:wrap;">
      <button type="button" class="secondary small" id="retryRecognizeBtn" style="margin-bottom:8px;">🔄 重新辨識（同一張圖）</button>
    </div>
    <div class="status" id="retryStatus"></div>

    <label>PSA 鑑定編號</label>
    <input type="text" id="certNumber">
    <div class="status" id="dupWarning"></div>

    <label>PSA 官方連結（自動產生）</label>
    <input type="text" id="psaUrl" readonly>

    <label>卡片標題</label>
    <input type="text" id="cardTitle">

    <label>系列 / 年份說明</label>
    <input type="text" id="setInfo">

    <div class="row">
      <div>
        <label>卡牌年份</label>
        <input type="text" id="cardYear" placeholder="例如 2018" inputmode="numeric">
      </div>
      <div>
        <label>鑑定分數</label>
        <input type="text" id="grade">
      </div>
    </div>

    <label>卡號（卡片本身印刷的，如 265/190 S 或 063/060 SR）</label>
    <input type="text" id="cardNumber" placeholder="辨識不出來可以手動輸入">

    <label>3. 買入金額</label>
    <div class="row">
      <input type="number" id="buyAmount" placeholder="金額" step="0.01">
      <select id="buyCurrency">
        <option value="JPY">JPY 日圓</option>
        <option value="USD">USD 美金</option>
        <option value="TWD">TWD 台幣</option>
      </select>
    </div>

    <label>4. 現在金額（市值，選填）</label>
    <div class="row">
      <input type="number" id="currentAmount" placeholder="金額" step="0.01">
      <select id="currentCurrency">
        <option value="JPY">JPY 日圓</option>
        <option value="USD">USD 美金</option>
        <option value="TWD">TWD 台幣</option>
      </select>
    </div>
    <div class="hint">兩者皆會依送出當下的即時匯率自動換算成 TWD 並計算損益</div>
    <div class="row" style="flex-wrap:wrap;">
      <button type="button" class="secondary small" id="checkGotcgsBtn" style="margin-top:8px;">🔍 GO TCGS 查價</button>
      <button type="button" class="secondary small" id="checkEbayBtn" style="margin-top:8px;">🔍 查 eBay 已售出</button>
      <button type="button" class="secondary small" id="checkGoogleBtn" style="margin-top:8px;">🔍 Google 查行情</button>
    </div>

    <button id="submitBtn">送出入庫</button>
    <button class="secondary" id="cancelBtn">重新拍照</button>
    <div class="status" id="submitStatus"></div>
  </div>

  <div class="card" id="resultSection">
    <label>✅ 已成功入庫</label>
    <div class="summary-row"><span>PSA 官方連結</span><a class="link" id="resPsaUrl" href="#" target="_blank"></a></div>
    <div class="summary-row"><span>買入金額 (TWD)</span><span id="resBuyTWD">-</span></div>
    <div class="summary-row"><span>現在金額 (TWD)</span><span id="resCurrentTWD">-</span></div>
    <div class="summary-row"><span>損益</span><b id="resProfit">-</b></div>
    <button id="newBtn">再新增一張</button>
    <button class="secondary" id="goInventoryBtn">查看庫存</button>
  </div>
</div>

<!-- ============ 庫存列表 ============ -->
<div id="inventorySection">
  <div class="card" id="summaryCard">
    <div class="hint" id="sumFilterNote" style="color:#f2b84b;"></div>
    <div class="hint">未實現損益（在庫）</div>
    <div class="big-pct" id="sumUnrealizedPct">-</div>
    <div class="hint" id="sumUnrealizedTWD"></div>
    <div class="summary-grid">
      <div>
        <div class="hint">總成本</div>
        <div class="val" id="sumTotalCost">-</div>
      </div>
      <div>
        <div class="hint">總市值</div>
        <div class="val" id="sumTotalValue">-</div>
      </div>
    </div>
    <div class="hint" id="sumCoverage" style="margin-top:8px;">已輸入市值 0 / 0 張</div>
    <div class="hint" id="sumRealized"></div>
    <button class="secondary" id="updateRatesBtn" style="margin-top:14px;">💱 更新全部匯率</button>
  </div>

  <div class="card">
    <div class="toolbar">
      <input type="search" id="searchInput" placeholder="搜尋 PSA編號 / 卡名 / 系列">
      <button class="secondary small" id="refreshBtn">🔄 重新整理</button>
    </div>
    <div class="row" style="margin-bottom:12px;">
      <select id="statusFilter">
        <option value="all">全部</option>
        <option value="在庫">只看在庫</option>
        <option value="已售出">只看已售出</option>
      </select>
      <select id="sortSelect">
        <option value="default">排序：新增時間</option>
        <option value="certAsc">排序：PSA編號（小→大）</option>
        <option value="certDesc">排序：PSA編號（大→小）</option>
        <option value="yearAsc">排序：年份（舊→新）</option>
        <option value="yearDesc">排序：年份（新→舊）</option>
        <option value="profitDesc">排序：損益%（高→低）</option>
        <option value="profitAsc">排序：損益%（低→高）</option>
      </select>
    </div>
    <div class="status" id="inventoryStatus"></div>
    <div id="itemList"></div>
  </div>
</div>

<script>
  // ---------- 共用 ----------
  async function callGAS(payload) {
    const resp = await fetch(CONFIG.GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    const data = await resp.json();
    if (!data.ok) throw new Error(data.error || '未知錯誤');
    return data;
  }

  function setStatus(el, type, msg) {
    el.className = 'status ' + type;
    el.textContent = msg;
  }

  function checkConfigured() {
    if (CONFIG.GAS_URL.includes('PASTE_YOUR')) {
      alert('請先在程式碼中設定 CONFIG.GAS_URL');
      return false;
    }
    return true;
  }

  // ---------- 免費離線 OCR 備援（Gemini 額度用完時自動切換）----------
  function isQuotaError(err) {
    const msg = ((err && err.message) || '').toLowerCase();
    return msg.includes('429') || msg.includes('resource_exhausted') || msg.includes('quota');
  }

  let tesseractLoading = null;
  function loadTesseract() {
    if (window.Tesseract) return Promise.resolve();
    if (tesseractLoading) return tesseractLoading;
    tesseractLoading = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
      s.onload = resolve;
      s.onerror = () => reject(new Error('OCR 函式庫載入失敗，請檢查網路連線'));
      document.head.appendChild(s);
    });
    return tesseractLoading;
  }

  // 純規則比對：從 OCR 出來的一大段文字裡，抓出鑑定編號 / 年份 / 分數
  function parseOcrText(text) {
    const certMatch = text.match(/\b\d{8,9}\b/);
    const yearMatch = text.match(/\b(19|20)\d{2}\b/);
    const gradeMatch = text.match(/(GEM\s*MT|MINT|NM[\s-]?MT|EX[\s-]?MT|VG[\s-]?EX|GOOD|FAIR|POOR|AUTHENTIC)\s*\d{0,2}/i);
    const certNumber = certMatch ? certMatch[0] : '';
    return {
      certNumber,
      cardTitle: '',
      setInfo: '',
      cardNumber: '',
      grade: gradeMatch ? gradeMatch[0].replace(/\s+/g, ' ').trim() : '',
      year: yearMatch ? yearMatch[0] : '',
      psaUrl: certNumber ? `https://www.psacard.com/cert/${certNumber}/psa` : ''
    };
  }

  async function tesseractRecognizeFallback(dataUrl) {
    await loadTesseract();
    const { data: { text } } = await Tesseract.recognize(dataUrl, 'eng');
    return parseOcrText(text);
  }

  // 先試 Gemini，額度用完(429)才自動切換成免費離線 OCR；其他錯誤照常丟出
  async function recognizeWithFallback(imageBase64, mimeType, dataUrl) {
    try {
      const data = await callGAS({ action: 'recognize', image: imageBase64, mimeType });
      return { fields: data.fields, usedFallback: false };
    } catch (err) {
      if (!isQuotaError(err)) throw err;
      const fields = await tesseractRecognizeFallback(dataUrl);
      return { fields, usedFallback: true };
    }
  }

  // ---------- Tabs ----------
  const tabAdd = document.getElementById('tabAdd');
  const tabInventory = document.getElementById('tabInventory');
  const addFlow = document.getElementById('addFlow');
  const inventorySection = document.getElementById('inventorySection');

  tabAdd.addEventListener('click', () => {
    tabAdd.classList.add('active'); tabInventory.classList.remove('active');
    addFlow.style.display = 'block'; inventorySection.style.display = 'none';
  });
  tabInventory.addEventListener('click', () => {
    tabInventory.classList.add('active'); tabAdd.classList.remove('active');
    addFlow.style.display = 'none'; inventorySection.style.display = 'block';
    loadInventory();
  });
  document.getElementById('goInventoryBtn').addEventListener('click', () => tabInventory.click());

  // ---------- 新增卡牌流程 ----------
  let imageBase64 = '';
  let imageMime = '';

  const cameraInput = document.getElementById('cameraInput');
  const galleryInput = document.getElementById('galleryInput');
  const preview = document.getElementById('preview');
  const recognizeBtn = document.getElementById('recognizeBtn');
  const recognizeStatus = document.getElementById('recognizeStatus');
  const confirmSection = document.getElementById('confirmSection');
  const captureSection = document.getElementById('captureSection');
  const resultSection = document.getElementById('resultSection');
  const submitStatus = document.getElementById('submitStatus');

  function compressImage(file, maxSize = 1800, quality = 0.92) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          let { width, height } = img;
          if (width > height && width > maxSize) {
            height = height * (maxSize / width); width = maxSize;
          } else if (height > maxSize) {
            width = width * (maxSize / height); height = maxSize;
          }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  document.getElementById('cameraBtn').addEventListener('click', () => cameraInput.click());
  document.getElementById('galleryBtn').addEventListener('click', () => galleryInput.click());

  async function handleFileSelected(file) {
    if (!file) return;
    const dataUrl = await compressImage(file);
    preview.src = dataUrl;
    preview.style.display = 'block';
    imageMime = 'image/jpeg';
    imageBase64 = dataUrl.split(',')[1];
    recognizeBtn.disabled = false;
  }

  cameraInput.addEventListener('change', () => handleFileSelected(cameraInput.files[0]));
  galleryInput.addEventListener('change', () => handleFileSelected(galleryInput.files[0]));

  recognizeBtn.addEventListener('click', async () => {
    if (!checkConfigured()) return;
    recognizeBtn.disabled = true;
    setStatus(recognizeStatus, 'loading', '辨識中，請稍候...');
    try {
      const { fields: f, usedFallback } = await recognizeWithFallback(imageBase64, imageMime, preview.src);
      document.getElementById('certNumber').value = f.certNumber;
      document.getElementById('psaUrl').value = f.psaUrl;
      document.getElementById('cardTitle').value = f.cardTitle;
      document.getElementById('setInfo').value = f.setInfo;
      document.getElementById('cardNumber').value = f.cardNumber;
      document.getElementById('grade').value = f.grade;
      document.getElementById('cardYear').value = f.year || '';
      if (usedFallback) {
        setStatus(recognizeStatus, 'warn', '⚠️ Gemini 額度已用完，已自動切換成免費離線 OCR。只抓得到編號/年份/分數，其餘欄位請手動輸入，並仔細核對所有欄位');
      } else {
        setStatus(recognizeStatus, 'success', '辨識完成，請確認以下資料');
      }
      captureSection.style.display = 'none';
      confirmSection.style.display = 'block';
      checkDuplicateCert(f.certNumber, document.getElementById('dupWarning'));
    } catch (err) {
      setStatus(recognizeStatus, 'error', '辨識失敗: ' + err.message);
    } finally {
      recognizeBtn.disabled = false;
    }
  });

  // 重新辨識同一張圖（只補空欄位，已經有值/手動改過的欄位不會被覆蓋）
  document.getElementById('retryRecognizeBtn').addEventListener('click', async () => {
    if (!checkConfigured()) return;

  async function checkDuplicateCert(certNumber, warnEl) {
    warnEl.className = 'status';
    const cert = (certNumber || '').trim();
    if (!cert || !checkConfigured()) return;
    try {
      const data = await callGAS({ action: 'checkCert', certNumber: cert });

        setStatus(warnEl, 'warn', `⚠️ 這個 PSA 編號已經在庫存中了！卡名：${data.card.cardTitle || '(未命名)'}（${data.card.status}）。請確認是否重複入庫。`);

    } catch (err) {

  // ---------- 庫存列表 ----------
  let allCards = [];

  function fmtTWD(n) {
    return (n || n === 0) && n !== '' ? `NT$ ${Number(n).toLocaleString()}` : '-';
  }

  function fmtSignedTWD(n) {
    const rounded = Math.round(n);
    return (rounded < 0 ? '-' : '+') + 'NT$ ' + Math.abs(rounded).toLocaleString();
  }

  function hasValue(v) {
    return v !== '' && v !== null && v !== undefined && !isNaN(Number(v)) && Number(v) !== 0;
  }

  // 拼圖卡/打包卡共用同一筆總成本、總市值，同一個 groupId 只留第一筆代表列，
  // 避免計算總覽時把同一筆錢重複加好幾次。
  function dedupeByGroup(cards) {
    const seen = new Set();
    const result = [];
    cards.forEach(c => {
      if (c.groupId) {
        if (seen.has(c.groupId)) return;
        seen.add(c.groupId);
      }
      result.push(c);
    });
    return result;
  }

  // 股票 App 風格的總覽：總成本 / 總市值 / 未實現損益% / 已實現損益
  // isFiltered=true 時代表這是搜尋/篩選後的子集合，不是全部庫存
  function renderSummary(cards, isFiltered) {
    document.getElementById('sumFilterNote').textContent =
      isFiltered ? `📍 目前只計算搜尋/篩選後的 ${cards.length} 張卡，不是全部庫存` : '';

    const inStock = cards.filter(c => c.status !== '已售出');
    const sold = cards.filter(c => c.status === '已售出');

    const inStockDeduped = dedupeByGroup(inStock);
    const totalCost = inStockDeduped.reduce((s, c) => s + (Number(c.buyTWD) || 0), 0);

    const pricedCards = inStock.filter(c => hasValue(c.currentAmount)); // 用實際張數顯示涵蓋率
    const pricedCardsDeduped = dedupeByGroup(pricedCards); // 用去重後的組別算錢
    const pricedCost = pricedCardsDeduped.reduce((s, c) => s + (Number(c.buyTWD) || 0), 0);
    const totalValue = pricedCardsDeduped.reduce((s, c) => s + (Number(c.currentTWD) || 0), 0);

    document.getElementById('sumTotalCost').textContent = fmtTWD(totalCost);
    document.getElementById('sumTotalValue').textContent = pricedCards.length ? fmtTWD(totalValue) : '尚無資料';
    document.getElementById('sumCoverage').textContent =
      `已輸入市值 ${pricedCards.length} / ${inStock.length} 張在庫卡`;

    const pctEl = document.getElementById('sumUnrealizedPct');
    const twdEl = document.getElementById('sumUnrealizedTWD');

    if (!pricedCards.length || !pricedCost) {
      pctEl.textContent = '尚無市值資料';
      pctEl.className = 'big-pct';
      twdEl.textContent = '至少輸入一張的「現在金額」才能計算損益';
    } else {
      const unrealizedTWD = totalValue - pricedCost;
      const unrealizedPct = (unrealizedTWD / pricedCost) * 100;
      pctEl.textContent = (unrealizedPct >= 0 ? '+' : '') + unrealizedPct.toFixed(2) + '%';
      pctEl.className = 'big-pct ' + (unrealizedPct >= 0 ? 'pos' : 'neg');
      twdEl.textContent = fmtSignedTWD(unrealizedTWD) +
        (pricedCards.length < inStock.length ? `（僅計已輸入市值的 ${pricedCards.length} 張）` : '');
    }

    const realizedEl = document.getElementById('sumRealized');
    if (sold.length) {
      const soldDeduped = dedupeByGroup(sold);
      const soldCost = soldDeduped.reduce((s, c) => s + (Number(c.buyTWD) || 0), 0);
      const soldValue = soldDeduped.reduce((s, c) => s + (Number(c.soldTWD) || 0), 0);
      const realizedTWD = soldValue - soldCost;
      const realizedPct = soldCost ? (realizedTWD / soldCost * 100) : null;
      realizedEl.textContent = `已實現損益（已售出 ${sold.length} 張）：${fmtSignedTWD(realizedTWD)}` +
        (realizedPct !== null ? ` (${realizedPct >= 0 ? '+' : ''}${realizedPct.toFixed(2)}%)` : '');
    } else {
      realizedEl.textContent = '';
    }
  }

  function getProfitValue(c) {
    const v = c.status === '已售出' ? c.realizedProfitPct : c.profitPct;
    return (v === '' || v === null || v === undefined || isNaN(Number(v))) ? null : Number(v);
  }

  function renderList() {
    const kw = searchInput.value.trim().toLowerCase();
    const st = statusFilter.value;
    const sortBy = sortSelect.value;
    const filtered = allCards.filter(c => {
      if (st !== 'all' && c.status !== st) return false;
      if (!kw) return true;
      const hay = `${c.certNumber} ${c.cardTitle} ${c.setInfo} ${c.cardNumber}`.toLowerCase();
      return hay.includes(kw);
    });

    // 總覽卡片改成只算「目前搜尋/篩選出來」的這批卡，不是全部庫存
    renderSummary(filtered, !!kw || st !== 'all');

    if (sortBy === 'certAsc') {
      filtered.sort((a, b) => (Number(a.certNumber) || 0) - (Number(b.certNumber) || 0));
    } else if (sortBy === 'certDesc') {
      filtered.sort((a, b) => (Number(b.certNumber) || 0) - (Number(a.certNumber) || 0));
    } else if (sortBy === 'yearAsc') {
      filtered.sort((a, b) => (Number(a.year) || 0) - (Number(b.year) || 0));
    } else if (sortBy === 'yearDesc') {
      filtered.sort((a, b) => (Number(b.year) || 0) - (Number(a.year) || 0));
    } else if (sortBy === 'profitDesc' || sortBy === 'profitAsc') {
      filtered.sort((a, b) => {
        const pa = getProfitValue(a), pb = getProfitValue(b);
        if (pa === null && pb === null) return 0;
        if (pa === null) return 1;  // 沒有損益資料的排最後
        if (pb === null) return -1;
        return sortBy === 'profitDesc' ? pb - pa : pa - pb;
      });
    }
    // sortBy === 'default' 時維持後端回傳的順序（新增時間新→舊）

    if (filtered.length === 0) {
      itemList.innerHTML = '<div class="empty">目前沒有符合的卡牌</div>';
      return;
    }

    itemList.innerHTML = filtered.map(c => {
      const thumbSrc = c.photoFileId
        ? `https://drive.google.com/thumbnail?id=${c.photoFileId}&sz=w200`
        : '';
      const isSold = c.status === '已售出';
      const badge = isSold
        ? '<span class="badge sold">已售出</span>'
        : '<span class="badge instock">在庫</span>';
      const groupBadge = c.groupId
        ? (c.groupType === '拼圖'
            ? '<span class="badge instock">🧩 拼圖組</span>'
            : '<span class="badge instock">📦 打包組</span>')
        : '';

      let profitHtml = '-';
      if (isSold && c.realizedProfitPct !== '' && c.realizedProfitPct !== undefined) {
        const p = c.realizedProfitPct;
        profitHtml = `<b class="${p >= 0 ? '' : 'neg'}">${p >= 0 ? '+' : ''}${p}%（已實現）</b>`;
      } else if (!isSold && c.profitPct !== '' && c.profitPct !== undefined) {
        const p = c.profitPct;
        profitHtml = `<b class="${p >= 0 ? '' : 'neg'}">${p >= 0 ? '+' : ''}${p}%</b>`;
      }

      const rightAmount = isSold ? fmtTWD(c.soldTWD) : fmtTWD(c.currentTWD);
      const rightLabel = isSold ? '售出' : '現在';

      // 查行情快速連結（自動化爬蟲不可行，改用手動查價捷徑）
      const priceQuery = encodeURIComponent(`${c.cardTitle || ''} ${c.setInfo || ''}`.trim());
      const ebayUrl = `https://www.ebay.com/sch/i.html?_nkw=${priceQuery}&LH_Sold=1&LH_Complete=1`;
      const googleUrl = `https://www.google.com/search?q=${priceQuery}+相場`;
      const gotcgsUrl = `https://gotcgs.com/search?q=${priceQuery}`;

      const metaParts = [c.year, c.certNumber || '-', c.cardNumber, c.grade || '-', c.setInfo]
        .filter(v => v !== '' && v !== undefined && v !== null);

      return `
        <div class="item" data-id="${c.id}">
          ${thumbSrc ? `<img class="thumb" src="${thumbSrc}" alt="">` : '<div class="thumb"></div>'}
          <div class="item-body">
            <div class="item-title">${c.cardTitle || '(未命名)'} ${badge} ${groupBadge}</div>
            <div class="item-meta">${metaParts.join(' · ')}</div>
            <div class="item-amounts">
              <span>買入 ${fmtTWD(c.buyTWD)}</span>
              <span>${rightLabel} ${rightAmount}</span>
              ${profitHtml}
            </div>
            <div class="item-links">
              <a class="link" href="${c.psaUrl}" target="_blank">PSA</a>
              <a class="link" href="${gotcgsUrl}" target="_blank">GO TCGS</a>
              <a class="link" href="${ebayUrl}" target="_blank">eBay</a>
              <a class="link" href="${googleUrl}" target="_blank">查行情</a>
            </div>
            <div class="item-actions">
              ${isSold ? '' : `<button class="secondary small" type="button" onclick="toggleValueForm('${c.id}')">編輯市值</button>`}
              ${isSold ? '' : `<button class="secondary small" type="button" onclick="toggleSoldForm('${c.id}')">標記售出</button>`}
              <button class="danger small" type="button" onclick="handleDelete('${c.id}')">刪除</button>
            </div>
            ${(!isSold && c.groupType === '拼圖') ? '<div class="hint">🧩 拼圖組：編輯市值 / 標記售出會套用到整組</div>' : ''}
            ${isSold ? '' : `
            <div class="sold-form" id="valueform-${c.id}">
              <div class="row">
                <input type="number" placeholder="現在金額（留空＝清除市值）" step="0.01" id="valueAmount-${c.id}" value="${c.currentAmount || ''}">
                <select id="valueCurrency-${c.id}">
                  <option value="JPY" ${c.currentCurrency === 'JPY' || !c.currentCurrency ? 'selected' : ''}>JPY</option>
                  <option value="USD" ${c.currentCurrency === 'USD' ? 'selected' : ''}>USD</option>
                  <option value="TWD" ${c.currentCurrency === 'TWD' ? 'selected' : ''}>TWD</option>
                </select>
              </div>
              <div class="row" style="margin-top:8px;">
                <button class="small" type="button" onclick="confirmValue('${c.id}')">確認更新</button>
                <button class="secondary small" type="button" onclick="toggleValueForm('${c.id}')">取消</button>
              </div>
            </div>`}
            ${isSold ? '' : `
            <div class="sold-form" id="soldform-${c.id}">
              <div class="row">
                <input type="number" placeholder="售出金額（選填，留空僅標記已售出）" step="0.01" id="soldAmount-${c.id}">
                <select id="soldCurrency-${c.id}">
                  <option value="JPY">JPY</option>
                  <option value="USD">USD</option>
                  <option value="TWD">TWD</option>
                </select>
              </div>
              <input type="date" id="soldDate-${c.id}" style="margin-top:8px;">
              <div class="row" style="margin-top:8px;">
                <button class="small" type="button" onclick="confirmSold('${c.id}')">確認售出</button>
                <button class="secondary small" type="button" onclick="toggleSoldForm('${c.id}')">取消</button>
              </div>
            </div>`}
          </div>
        </div>
      `;
    }).join('');
  }

  window.toggleSoldForm = function(id) {
    const el = document.getElementById(`soldform-${id}`);
    if (el) el.classList.toggle('open');
  };

  window.confirmSold = async function(id) {
    const amount = document.getElementById(`soldAmount-${id}`).value;
    const currency = document.getElementById(`soldCurrency-${id}`).value;
    const date = document.getElementById(`soldDate-${id}`).value;
    // 售出金額選填：留空代表只標記已售出，不記錄賣多少錢（例如送人、交換）
    setStatus(inventoryStatus, 'loading', '更新中...');
    try {
      await callGAS({ action: 'markSold', id, soldAmount: amount, soldCurrency: currency, soldDate: date });
      inventoryStatus.className = 'status';
      loadInventory();
    } catch (err) {
      setStatus(inventoryStatus, 'error', '更新失敗: ' + err.message);
    }
  };

  window.toggleValueForm = function(id) {
    const el = document.getElementById(`valueform-${id}`);
    if (el) el.classList.toggle('open');
  };

  window.confirmValue = async function(id) {
    const amount = document.getElementById(`valueAmount-${id}`).value;
    const currency = document.getElementById(`valueCurrency-${id}`).value;
    setStatus(inventoryStatus, 'loading', '更新市值中...');
    try {
      await callGAS({ action: 'updateValue', id, currentAmount: amount, currentCurrency: currency });
      inventoryStatus.className = 'status';
      loadInventory();
    } catch (err) {
      setStatus(inventoryStatus, 'error', '更新市值失敗: ' + err.message);
    }
  };

  window.handleDelete = async function(id) {
    if (!confirm('確定要刪除這筆資料嗎？此動作無法復原。')) return;
    setStatus(inventoryStatus, 'loading', '刪除中...');
    try {
      await callGAS({ action: 'delete', id });
      inventoryStatus.className = 'status';
      loadInventory();
    } catch (err) {
      setStatus(inventoryStatus, 'error', '刪除失敗: ' + err.message);
    }
  };

  document.getElementById('refreshBtn').addEventListener('click', loadInventory);
  searchInput.addEventListener('input', renderList);
  statusFilter.addEventListener('change', renderList);
  sortSelect.addEventListener('change', renderList);

  document.getElementById('updateRatesBtn').addEventListener('click', async () => {
    const btn = document.getElementById('updateRatesBtn');
    btn.disabled = true;
    setStatus(inventoryStatus, 'loading', '正在查詢最新匯率並重算市值...');
    try {
      const data = await callGAS({ action: 'refreshRates' });
      await loadInventory();
      setStatus(inventoryStatus, 'success', `已用最新匯率更新 ${data.updated} 張在庫卡片的市值與損益`);
    } catch (err) {
      setStatus(inventoryStatus, 'error', '更新匯率失敗: ' + err.message);
    } finally {
      btn.disabled = false;
    }
  });
</script>

</body>
</html>
